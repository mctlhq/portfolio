# Security headers for the portfolio site, defined exactly once and
# included wherever nginx.conf needs them (server level and each location
# block) via `include /etc/nginx/security-headers.conf;`. A location-level
# add_header discards the whole set it would otherwise inherit from its
# parent, which is why this file exists instead of six add_header lines
# repeated in five places -- see docs/hardening-notes.md.
#
# __SCRIPT_SRC_HASHES__ is substituted at image build time by the Dockerfile
# with the build's inline-script SHA-256 hash(es), computed from dist/ by
# scripts/csp-hash.mjs.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' __SCRIPT_SRC_HASHES__; style-src 'self'; font-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
