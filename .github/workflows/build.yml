name: build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci --no-audit --no-fund

      # `prebuild` is `npm run vendor && npm test`, so this is a strict
      # superset of the previous `npm test` step, and it produces the dist/
      # tree the link check needs.
      - run: npm run build

      - run: node scripts/check-links.mjs

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: portfolio:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run container and check response headers
        run: |
          set -e
          container_id="$(docker run -d -p 8080:80 portfolio:ci)"
          trap 'docker logs "$container_id" || true; docker stop "$container_id" >/dev/null' EXIT

          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/healthz >/dev/null; then
              break
            fi
            sleep 1
          done

          node scripts/check-headers.mjs http://127.0.0.1:8080
